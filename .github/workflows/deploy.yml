name: deploy (manual)

# Despliegue manual con wrangler. Opcional: el flujo principal es la
# integración Git nativa de Cloudflare Pages (docs/DESPLIEGUE.md). Solo se
# dispara a mano para no duplicar el deploy automático de Pages.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate project
        run: node scripts/validate.js
      - name: Build site
        run: node core/site/build.js
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=proyectolibero
