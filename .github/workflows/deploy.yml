name: deploy

# Publica el sitio en Cloudflare Pages con wrangler.
#
# Camino A (recomendado): integración Git nativa de Pages. En ese caso
# DESACTIVA este workflow (borra el trigger `push:` o el fichero) para no
# desplegar dos veces. Ver docs/DESPLIEGUE.md.
#
# Camino B (este workflow): requiere dos secrets del repositorio
# (CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID), que añade un humano en
# GitHub → Settings → Secrets and variables → Actions → New repository secret.
# Si faltan, el job falla con un mensaje claro y no publica nada. Nunca se
# escribe el valor de un token aquí, en el repo ni en los docs.
#
# Publicar es un acto deliberado: solo se dispara en `push` a `master`
# (y a mano con workflow_dispatch). Nunca en pull requests ni ramas de trabajo.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Un despliegue a la vez: encola en lugar de cancelar, para no dejar el sitio a
# medio publicar si dos pushes llegan seguidos.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate project
        run: node scripts/validate.js
      - name: Build site
        run: node core/site/build.js
      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets del repositorio:$missing. Añádelos en GitHub → Settings → Secrets and variables → Actions → New repository secret, y vuelve a lanzar el workflow. No pongas el valor en el repo, el YAML ni los docs."
            exit 1
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=proyectolibero
      # Smoke test post-deploy: un deploy roto (cabeceras, caché, repo expuesto
      # o peso) se detecta en el acto. Usa el sitio canónico vivo.
      - name: Smoke test post-deploy (sitio vivo)
        run: node scripts/verify-published.js --base=https://proyectolibero.org
